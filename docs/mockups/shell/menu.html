<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jugnu — Menu bar</title>
<style>
  :root{color-scheme:dark;--page:#0b0a08;--menu:#1c1914;--border:#332c1f;--text:#f3ede0;--muted:#9d9481;--accent:#f5a623;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);padding:28px 32px 48px}
  h1{font:600 18px/1.2 "SF Pro Display",-apple-system,sans-serif;margin:0 0 4px}
  .lead{margin:0 0 28px;color:var(--muted);font-size:12px}
  .pair{display:flex;gap:48px;flex-wrap:wrap;align-items:flex-start}
  .case{min-width:280px}
  .case h2{font:600 12px/1 "SF Pro Display",sans-serif;margin:0 0 10px;color:var(--muted)}
  .bar{height:28px;background:#14120e;border:1px solid #29251d;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:flex-end;padding:0 10px}
  .status{width:16px;height:16px;border-radius:50%;background:#f5a623;box-shadow:0 0 6px #ffc460}
  .menu{width:220px;margin-left:auto;background:var(--menu);border:1px solid var(--border);border-top:0;border-radius:0 0 10px 10px;padding:6px;box-shadow:0 18px 40px #000a}
  .item{height:28px;border-radius:6px;padding:0 10px;display:flex;align-items:center;font-size:13px}
  .item:hover{background:#2a2418}
  .rule{height:1px;background:var(--border);margin:5px 6px}
</style>
</head>
<body>
<h1>Menu bar</h1>
<p class="lead">One Jugnu item. No pins keeps a single divider. Up to five pinned Addons sit between two dividers.</p>
<div class="pair">
  <section class="case">
    <h2>No pinned Addons</h2>
    <div class="bar"><span class="status" aria-label="Jugnu"></span></div>
    <div class="menu" role="menu">
      <div class="item" role="menuitem">Open Jugnu</div>
      <div class="item" role="menuitem">Open Preferences</div>
      <div class="rule"></div>
      <div class="item" role="menuitem">Quit</div>
    </div>
  </section>
  <section class="case">
    <h2>Two pinned Addons</h2>
    <div class="bar"><span class="status" aria-label="Jugnu"></span></div>
    <div class="menu" role="menu">
      <div class="item" role="menuitem">Open Jugnu</div>
      <div class="item" role="menuitem">Open Preferences</div>
      <div class="rule"></div>
      <div class="item" role="menuitem">Temporary Folder</div>
      <div class="item" role="menuitem">Floating Note</div>
      <div class="rule"></div>
      <div class="item" role="menuitem">Quit</div>
    </div>
  </section>
</div>
</body>
</html>
