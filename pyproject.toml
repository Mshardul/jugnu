[project]
name = "jugnu"
version = "0.0.0"
description = "A little light for everything on your Mac"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shardul Lingwal" }]

# Runtime leaves are stdlib-first; tooling lives in the dev group.
dependencies = []

[dependency-groups]
dev = [
    "codespell>=2.3",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.16.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["addons"]

[tool.ruff.lint]
# Keep leaf packages readable; skip opinionated SIM rewrites for now.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "B904"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
files = ["addons"]
# Match other repos: type-check product code, not tests.
exclude = ["(?x)(/tests/|/__pycache__/|/\\.venv/)"]

[tool.codespell]
skip = ".git,.venv,uv.lock,.mypy_cache,.ruff_cache,.pytest_cache,__pycache__"
# jugnu = brand; rime = WMO weather label; iterm = iTerm app name
ignore-words-list = "jugnu,crate,rime,iterm,assertin"

[tool.pytest.ini_options]
testpaths = ["addons"]
python_files = ["test_*.py"]
addopts = "-q"
