# Jugnu config (example)
# Aligned with docs/architecture/2026-08-22-shell-design.md
# Proposed path: ~/.config/jugnu/jugnu.yaml
# Shell does not load this until implemented.

version: 1

shell:
  hotkey: "option+space" # default; first-run may opt in to cmd+space

addons:
  # Only listed + enabled addons appear in palette search.
  # Install path: ~/.local/share/jugnu/addons/<id>/
  mic-mute:
    enabled: true
  focus-toggle:
    enabled: true
  paste-plain:
    enabled: false

ui: {}
# Reserved for later (first screen, theme, …).

# Dev only (optional): load unpacked addon sources without a Release zip
# dev:
#   addon_paths:
#     - /path/to/jugnu/addons
