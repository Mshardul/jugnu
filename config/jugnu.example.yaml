# Jugnu config (example)
# Path: ~/.config/jugnu/jugnu.yaml

version: 1

shell:
  hotkey: "option+space" # default; first-run may opt in to cmd+space
  registry_url: "https://raw.githubusercontent.com/Mshardul/jugnu/main/registry/addons.json"

sound: true

palette:
  first_view: blank   # blank | recent | favorites

theme:
  light:
    accent: "#C97A12"
    background: "#F7F3EA"
    surface: "#FFFDF8"
    text_primary: "#2A2417"
    text_secondary: "#756E5C"
    error: "#E5484D"
  dark:
    accent: "#F5A623"
    background: "#16130E"
    surface: "#1F1B13"
    text_primary: "#EDE6D9"
    text_secondary: "#8C8577"
    error: "#E5484D"

addons:
  # Only listed + enabled addons appear in palette search.
  # Install path: ~/.local/share/jugnu/addons/<id>/
  mic-mute:
    enabled: true
  focus-toggle:
    enabled: true
  paste-plain:
    enabled: false

ui: {}
# Reserved (do not use for theme — that is the theme: block above).
