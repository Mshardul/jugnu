included:
  - shell/Sources
  - shell/Tests
  - shell/TestsExtended
excluded:
  - shell/.build
  - shell/.swiftpm
  - shell/TestsExtended/.build
  - shell/TestsExtended/.swiftpm
  - DerivedData

# Keep rules focused on correctness and maintainability; formatting belongs to SwiftFormat.
opt_in_rules:
  - empty_count
  - empty_string
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool

analyzer_rules:
  - unused_declaration
  - unused_import

force_cast: warning
force_try: warning
line_length:
  warning: 120
  error: 160
file_length:
  warning: 500
  error: 800
type_body_length:
  warning: 300
  error: 500
function_body_length:
  warning: 80
  error: 150
cyclomatic_complexity:
  warning: 10
  error: 20
large_tuple:
  warning: 3
  error: 4

reporter: xcode
