id: jugnu.clip-tools
name: Clip Tools
version: 1.2.1
api: 1
permissions:
  - clipboard
helpers:
  - id: python-runtime
    version: 1.0.0
commands:
  - id: text-stats
    title: Text stats
    subtitle: Words, chars, lines, reading time
    keywords: [stats, words, count]
  - id: sort-lines
    title: Sort lines
    alias: sort
    subtitle: Sort clipboard lines
    keywords: [sort, lines]
  - id: reverse-lines
    title: Reverse lines
    subtitle: Reverse clipboard line order
    keywords: [reverse, lines]
  - id: dedupe-lines
    title: Dedupe lines
    alias: dedupe
    subtitle: Remove duplicate lines
    keywords: [dedupe, unique]
  - id: trim-lines
    title: Trim lines
    subtitle: Trim whitespace on each line
    keywords: [trim]
  - id: number-lines
    title: Number lines
    subtitle: Add line numbers
    keywords: [number, lines]
  - id: join-lines
    title: Join lines
    subtitle: Join lines with a separator
    keywords: [join]
  - id: split-lines
    title: Split lines
    subtitle: Split text into lines by delimiter
    keywords: [split]
  - id: prefix-suffix
    title: Prefix / suffix lines
    subtitle: Add or remove prefix/suffix per line
    keywords: [prefix, suffix]
  - id: cut-field
    title: Cut field
    subtitle: Cut Nth field from TSV/CSV lines
    keywords: [cut, field, column]
  - id: case
    title: Change case
    alias: case
    subtitle: lower / UPPER / Title / camel / snake / kebab (args.style)
    keywords: [case]
  - id: case-lower
    title: lowercase
    subtitle: Clipboard to lowercase
    keywords: [lower]
  - id: case-upper
    title: UPPERCASE
    subtitle: Clipboard to UPPERCASE
    keywords: [upper]
  - id: case-title
    title: Title Case
    subtitle: Clipboard to Title Case
    keywords: [title]
  - id: case-camel
    title: camelCase
    subtitle: Clipboard to camelCase
    keywords: [camel]
  - id: case-snake
    title: snake_case
    subtitle: Clipboard to snake_case
    keywords: [snake]
  - id: case-kebab
    title: kebab-case
    subtitle: Clipboard to kebab-case
    keywords: [kebab]
  - id: json-pretty
    title: JSON pretty
    alias: json
    subtitle: Pretty-print clipboard JSON
    keywords: [json, pretty, format]
  - id: json-minify
    title: JSON minify
    subtitle: Minify clipboard JSON
    keywords: [json, minify]
  - id: csv-pretty
    title: CSV pretty
    subtitle: Normalize clipboard CSV
    keywords: [csv]
  - id: xml-pretty
    title: XML pretty
    subtitle: Pretty-print clipboard XML
    keywords: [xml]
  - id: csv-json
    title: CSV → JSON
    subtitle: Convert CSV to JSON
    keywords: [csv, json]
  - id: json-csv
    title: JSON → CSV
    subtitle: Convert JSON array to CSV
    keywords: [json, csv]
  - id: xml-json
    title: XML → JSON
    subtitle: Convert XML to JSON
    keywords: [xml, json]
  - id: json-path
    title: JSON path
    subtitle: Extract a path from clipboard JSON
    keywords: [json, path, jsonpath]
  - id: yaml-pretty
    title: YAML pretty
    subtitle: Pretty-print clipboard YAML
    keywords: [yaml]
  - id: yaml-json
    title: YAML → JSON
    subtitle: Convert YAML to JSON
    keywords: [yaml, json]
  - id: json-yaml
    title: JSON → YAML
    subtitle: Convert JSON to YAML
    keywords: [json, yaml]
  - id: base64-encode
    title: Base64 encode
    alias: b64
    subtitle: Encode clipboard as Base64
    keywords: [base64, encode]
  - id: base64-decode
    title: Base64 decode
    subtitle: Decode Base64 clipboard
    keywords: [base64, decode]
  - id: url-encode
    title: URL encode
    subtitle: Percent-encode clipboard
    keywords: [url, encode]
  - id: url-decode
    title: URL decode
    subtitle: Percent-decode clipboard
    keywords: [url, decode]
  - id: html-escape
    title: HTML escape
    subtitle: Escape HTML entities
    keywords: [html, escape]
  - id: html-unescape
    title: HTML unescape
    subtitle: Unescape HTML entities
    keywords: [html, unescape]
  - id: jwt-decode
    title: JWT decode
    alias: jwt
    subtitle: Decode JWT header/payload (no verify)
    keywords: [jwt]
  - id: hash
    title: Hash
    alias: hash
    subtitle: SHA-256 (or args.algo) of text or file path
    keywords: [hash, sha256]
  - id: slugify
    title: Slugify
    alias: slug
    subtitle: URL/file slug from clipboard
    keywords: [slug]
  - id: uuid
    title: UUID
    alias: uuid
    subtitle: Generate UUID / ULID-like / nanoid
    keywords: [uuid, ulid, nanoid]
  - id: timestamp
    title: Timestamp
    alias: ts
    subtitle: Now as unix / ISO / RFC3339 / local
    keywords: [timestamp, time, iso]
  - id: iso-week
    title: ISO week
    subtitle: Current ISO week number
    keywords: [week, iso]
  - id: tabs-spaces
    title: Tabs ↔ spaces
    subtitle: Convert tabs and spaces
    keywords: [tabs, spaces]
  - id: invisible-chars
    title: Invisible chars
    subtitle: Show or strip invisible characters
    keywords: [zwsp, nbsp]
  - id: markdown-table
    title: Markdown table
    subtitle: TSV/CSV ↔ Markdown table
    keywords: [markdown, table]
  - id: extract-emails
    title: Extract emails
    subtitle: Pull emails from clipboard
    keywords: [email]
  - id: lorem
    title: Lorem
    alias: lorem
    subtitle: Placeholder words
    keywords: [lorem, ipsum]
  - id: regex-replace
    title: Regex replace
    alias: regex
    subtitle: Replace with a regex pattern
    keywords: [regex, replace]
  - id: unicode-name
    title: Unicode name
    subtitle: Codepoint / Unicode name
    keywords: [unicode]
  - id: md-link
    title: Markdown link
    subtitle: Build a markdown link
    keywords: [markdown, link]
  - id: clip-clear
    title: Clear clipboard
    alias: clear-clip
    subtitle: Wipe the general pasteboard
    keywords: [clear, clipboard]
  - id: paste-plain
    title: Paste as plain text
    alias: plain
    subtitle: Strip rich text from the clipboard
    keywords: [paste, plain, clipboard]
  - id: json-tsv
    title: JSON to TSV
    subtitle: Clipboard JSON array to TSV
    keywords: [json, tsv]
  - id: tsv-json
    title: TSV to JSON
    subtitle: Clipboard TSV to JSON
    keywords: [tsv, json]
  - id: csv-tsv
    title: CSV to TSV
    subtitle: Clipboard CSV to TSV
    keywords: [csv, tsv]
  - id: tsv-csv
    title: TSV to CSV
    subtitle: Clipboard TSV to CSV
    keywords: [tsv, csv]
  - id: json-xml
    title: JSON to XML
    subtitle: Clipboard JSON to XML
    keywords: [json, xml]
  - id: csv-markdown-table
    title: CSV to Markdown table
    subtitle: Clipboard CSV to a Markdown table
    keywords: [csv, markdown, table]
  - id: json-markdown-table
    title: JSON to Markdown table
    subtitle: Clipboard JSON array to a Markdown table
    keywords: [json, markdown, table]
  - id: markdown-table-csv
    title: Markdown table to CSV
    subtitle: Clipboard Markdown table to CSV
    keywords: [markdown, table, csv]
  - id: markdown-table-json
    title: Markdown table to JSON
    subtitle: Clipboard Markdown table to JSON
    keywords: [markdown, table, json]
  - id: markdown-html
    title: Markdown to HTML
    subtitle: Clipboard Markdown to HTML
    keywords: [markdown, html]
  - id: html-markdown
    title: HTML to Markdown
    subtitle: Clipboard HTML to Markdown
    keywords: [html, markdown]
  - id: html-plain
    title: HTML to plain text
    subtitle: Clipboard HTML to plain text
    keywords: [html, text]
converters:
  - command: json-csv
    from: json
    to: csv
    modes: [text, file]
  - command: csv-json
    from: csv
    to: json
    modes: [text, file]
  - command: xml-json
    from: xml
    to: json
    modes: [text, file]
  - command: yaml-json
    from: yaml
    to: json
    modes: [text, file]
  - command: json-yaml
    from: json
    to: yaml
    modes: [text, file]
  - command: json-tsv
    from: json
    to: tsv
    modes: [text, file]
  - command: tsv-json
    from: tsv
    to: json
    modes: [text, file]
  - command: csv-tsv
    from: csv
    to: tsv
    modes: [text, file]
  - command: tsv-csv
    from: tsv
    to: csv
    modes: [text, file]
  - command: json-xml
    from: json
    to: xml
    modes: [text, file]
  - command: csv-markdown-table
    from: csv
    to: markdown-table
    modes: [text, file]
  - command: json-markdown-table
    from: json
    to: markdown-table
    modes: [text, file]
  - command: markdown-table-csv
    from: markdown-table
    to: csv
    modes: [text, file]
  - command: markdown-table-json
    from: markdown-table
    to: json
    modes: [text, file]
  - command: markdown-html
    from: markdown
    to: html
    modes: [text, file]
  - command: html-markdown
    from: html
    to: markdown
    modes: [text, file]
  - command: html-plain
    from: html
    to: plain
    modes: [text, file]
entrypoint:
  kind: exec
  path: bin/run
cleanup:
  paths: []
  launchd: []
