id: floating-note
name: Floating Note
version: 1.0.0
api: 1
commands:
  - id: open
    title: Open scratch note
    subtitle: Always-on-top scratchpad saved to a local file
    keywords: [note, scratch, memo, floating]
    ui:
      pattern: note
entrypoint:
  kind: exec
  path: bin/run
cleanup:
  paths:
    - "~/.local/share/jugnu/state/floating-note"
  launchd: []
