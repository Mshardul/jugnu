id: clipboard-history
name: Clipboard History
version: 1.0.0
api: 1
commands:
  - id: list
    title: Clipboard history
    subtitle: Browse and copy recent clipboard entries
    keywords: [clipboard, history, paste, copy]
    ui:
      pattern: list
entrypoint:
  kind: exec
  path: bin/run
cleanup:
  paths:
    - "~/.local/share/jugnu/state/clipboard-history"
    - "~/Library/LaunchAgents/com.jugnu.clipboard-history.watch.plist"
  launchd:
    - com.jugnu.clipboard-history.watch
