id: jugnu.floating-note
name: Temporary Note
version: 1.0.0
api: 1
commands:
  - id: open
    title: Temporary note
    subtitle: Floating sticky kept on this Mac and restored next time
    keywords: [temporary, note, sticky, scratch, memo, floating]
    ui:
      pattern: note
entrypoint:
  kind: exec
  path: bin/run
cleanup:
  paths:
    - "~/.local/share/jugnu/state/floating-note"
  launchd: []
